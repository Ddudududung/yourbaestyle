<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Montserrat:wght@600;700&amp;display=swap');
      .logo-bg { fill: #FFDCED; }
      .petal { fill: #FFB3D6; opacity: 0.65; }
      .hanger { fill: none; stroke: #DE2571; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .text-yourbae { font-family: 'Great Vibes', 'Brush Script MT', cursive; font-size: 42px; fill: #DE2571; text-anchor: middle; font-weight: bold; }
      .text-style { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; fill: #333333; letter-spacing: 4px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" class="logo-bg" />

  <!-- Flower Petals Background -->
  <g class="flower">
    <ellipse cx="100" cy="45" rx="32" ry="42" class="petal" />
    <ellipse cx="100" cy="155" rx="32" ry="42" class="petal" />
    <ellipse cx="100" cy="100" rx="32" ry="42" class="petal" transform="rotate(60 100 100)" />
    <ellipse cx="100" cy="100" rx="32" ry="42" class="petal" transform="rotate(120 100 100)" />
    <ellipse cx="100" cy="100" rx="32" ry="42" class="petal" transform="rotate(240 100 100)" />
    <ellipse cx="100" cy="100" rx="32" ry="42" class="petal" transform="rotate(300 100 100)" />
  </g>

  <!-- Clothes Hangers -->
  <g transform="translate(100, 72) scale(0.9)">
    <!-- Hanger 1 -->
    <path d="M-22,8 L0,-12 L22,8 Z" class="hanger" />
    <path d="M0,-12 C0,-18 5,-22 0,-26 C-5,-22 0,-18 0,-12" class="hanger" />
    <!-- Hanger 2 offset -->
    <path d="M-15,3 L7,-17 L29,3 Z" class="hanger" opacity="0.85" />
  </g>

  <!-- Text: yourbae -->
  <text x="100" y="118" class="text-yourbae">yourbae</text>

  <!-- Text: STYLE -->
  <text x="102" y="134" class="text-style">STYLE</text>
</svg>
